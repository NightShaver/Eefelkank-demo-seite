name: GitHub Pages

on:
  push:
    branches: [main]
  # Wird vom CMS ausgeloest, sobald jemand Inhalte veroeffentlicht.
  repository_dispatch:
    types: [cms-aktualisierung]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Statischen Export bauen
        run: npm run build:pages
        env:
          # Bei einem Projekt-Repository liegt die Seite unter /name-des-repos,
          # bei einer Benutzerseite unter /. Beides kommt von configure-pages.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Zugang zum CMS. Ohne CMS_API_KEY bricht der Bau nicht ab, sondern
          # nimmt die zuletzt eingecheckten Inhalte aus src/lib/data/generated.
          CMS_URL: https://cms.rocket-six.com
          CMS_KUNDE: eefelkank
          CMS_API_KEY: ${{ secrets.CMS_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
